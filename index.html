<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#f7f9fb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="يومي">
<meta name="description" content="سجل يومك وصحتك والشقيقة محليًا بخصوصية عالية."><link rel="icon" href="assets/icon-192.png"><link rel="apple-touch-icon" href="assets/icon-192.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css">
<title>يومي | Daily Health</title>
</head>
<body>
<div id="app" class="app">
<header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true">♡</div><div><strong>يومي</strong><small>صحتك، ببساطة</small></div></div><div class="top-actions"><span id="save-status" class="save-status">محفوظ محليًا</span><button class="icon-btn" id="theme-btn" aria-label="تغيير المظهر">☾</button><button class="icon-btn" data-go="settings" aria-label="الإعدادات">⚙</button></div></header>
<main id="view" aria-live="polite"></main>
<div id="composer" class="composer"><div id="paste-hint" class="paste-hint" hidden></div><div class="composer-main"><label class="sr-only" for="quick-text">سجل شيئًا أو الصق صورة</label><textarea id="quick-text" rows="1" placeholder="اكتب «كاسة» أو الصق سكرينشوت…"></textarea><button class="composer-action" id="paste-btn" title="لصق صورة من الحافظة" aria-label="لصق صورة">▣</button><button class="composer-action send" id="send-btn" aria-label="حفظ التسجيل">➤</button></div><div class="nav" role="navigation" aria-label="التنقل الرئيسي"><button data-go="today" class="nav-item active"><span>⌂</span><small>يومي</small></button><button data-go="history" class="nav-item"><span>▦</span><small>السجل</small></button><button data-go="analytics" class="nav-item"><span>▥</span><small>التحليل</small></button></div></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="modal-layer" class="modal-layer" hidden><div class="modal-backdrop" data-close="modal"></div><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2 id="modal-title"></h2><button class="icon-btn" data-close="modal" aria-label="إغلاق">✕</button></div><div id="modal-body"></div></div></div>
<input id="image-picker" type="file" accept="image/*" hidden><input id="json-picker" type="file" accept="application/json,.json" hidden>
</div>
<script type="module" src="app.js"></script>
</body></html>
